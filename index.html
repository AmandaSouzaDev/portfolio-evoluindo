
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amanda Souza</title>

  <meta name="theme-color" content="#090609">
  <meta name="description" content="Amanda Souza | Design e Tecnologia">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090609;
      font-family: Arial, Helvetica, sans-serif;
    }

    .tela {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      background: #090609;
    }

    .video-fundo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    .sombra {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.15),
          rgba(12, 0, 9, 0.38) 50%,
          rgba(0, 0, 0, 0.72)
        );
    }

    .brilho {
      position: absolute;
      width: 380px;
      height: 380px;
      max-width: 90vw;
      border-radius: 50%;
      background: rgba(255, 20, 147, 0.20);
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
    }

    .perfil {
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: aparecer 1.3s ease both;
    }

    .foto-moldura {
      width: clamp(150px, 24vw, 230px);
      aspect-ratio: 1;
      padding: 5px;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #ff8bd4,
        #ff1493,
        #790044
      );
      box-shadow:
        0 0 22px rgba(255, 20, 147, 0.65),
        0 0 65px rgba(255, 20, 147, 0.30);
      animation: flutuar 4s ease-in-out infinite;
    }

    .foto {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 3px solid #090609;
      background: #1b1019;
    }

    .nome {
      margin-top: 28px;
      color: #ffffff;
      font-size: clamp(2.2rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: clamp(1px, 0.7vw, 6px);
      line-height: 1.1;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(255, 20, 147, 0.95),
        0 0 28px rgba(255, 20, 147, 0.65),
        0 4px 25px rgba(0, 0, 0, 0.9);
    }

    .linha-pink {
      width: 90px;
      height: 3px;
      margin-top: 20px;
      border-radius: 10px;
      background: #ff1493;
      box-shadow: 0 0 15px #ff1493;
    }

    .assinatura {
      margin-top: 16px;
      color: #ffd6ed;
      font-size: clamp(0.75rem, 2vw, 1rem);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes flutuar {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-9px);
      }
    }

    @media (max-width: 480px) {
      .perfil {
        padding: 18px;
      }

      .nome {
        margin-top: 24px;
      }

      .assinatura {
        letter-spacing: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="tela">

    <video
      class="video-fundo"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-hidden="true"
    >
      <source
        src="V%C3%8DDEO%20FUNDO%20ROSA.mp4"
        type="video/mp4"
      >
    </video>

    <div class="sombra"></div>
    <div class="brilho"></div>

    <section class="perfil" aria-label="Apresentação de Amanda Souza">

      <div class="foto-moldura">
        <img
          class="foto"
          src="Imagem%20do%20WhatsApp%202026-10-16%20%C3%A0s%2013%3A24%3A10.jpeg"
          alt="Foto de Amanda Souza"
        >
      </div>

      <h1 class="nome">Amanda Souza</h1>

      <div class="linha-pink"></div>

      <p class="assinatura">Design &amp; Tecnologia</p>

    </section>
  </main>
</body>
</html>
